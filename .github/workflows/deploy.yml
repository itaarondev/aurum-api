name: CI/CD Pipeline - Deploy Aurum API to Azure

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código fuente
        uses: actions/checkout@v4

      - name: 2. Configurar SDK de .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 3. Autenticarse en Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 4. Instalar herramientas de Entity Framework Core
        run: |
          dotnet tool install --global dotnet-ef

      - name: 5. Aplicar Migraciones en Azure SQL (Automatizado)
        run: |
          # Restauramos las dependencias
          dotnet restore src/Api/Aurum.Api/Aurum.Api.csproj

          # Construimos la cadena de conexión usando Active Directory Default para aprovechar la sesión de Azure CLI
          SQL_CONN_STR="Server=tcp:server-aurum-dev-eus.database.windows.net,1433;Initial Catalog=AurumDb;Encrypt=True;TrustServerCertificate=False;Authentication=Active Directory Default;"
          
          # Corregido el nombre de la carpeta a Aurum.Persistence
          dotnet ef database update --project src/Infrastructure/Aurum.Persistence --startup-project src/Api/Aurum.Api --connection "$SQL_CONN_STR"

      - name: 6. Iniciar sesión en Azure Container Registry (ACR)
        run: |
          az acr login --name acraurumdeveus

      - name: 7. Compilar y publicar imagen de Docker
        env:
          REGISTRY: acraurumdeveus.azurecr.io
          REPOSITORY: aurum-api
          IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: 8. Desplegar contenedor en Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: "as-aurum-dev-api-eus"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: "acraurumdeveus.azurecr.io/aurum-api:latest"
